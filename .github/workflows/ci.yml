# RAG Java 与 Python 引擎共同验证。
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-security:
    name: Build, Test, and Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Checkout rpc-api dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sunkailun1992/rpc-api
          # Match the exact com:rpc-api:1.0.9 dependency when main advances.
          ref: 8021adbcae7cf1c8c1bd157bf57d482c6fa439ac
          path: .ci-rpc-api

      - name: Checkout utils dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sunkailun1992/utils
          ref: cf7643e23649b45eb6d2faeef5ae05fc6817fa03 # com:utils 1.6.6 / fleet-observability 0.1.4
          path: .ci-utils

      - name: Hide CI dependency checkout from scans
        run: |
          echo ".ci-rpc-api/" >> .git/info/exclude
          echo ".ci-utils/" >> .git/info/exclude

      - name: Publish rpc-api to Maven Local
        working-directory: .ci-rpc-api
        run: ./gradlew -q publishToMavenLocal

      - name: Publish utils and observability to Maven Local
        working-directory: .ci-utils
        run: ./gradlew -q :fleet-observability:publishToMavenLocal publishToMavenLocal

      - name: Prepare scripts
        run: chmod +x gradlew scripts/check-secrets.sh

      - name: Compile
        run: ./gradlew -q compileJava

      - name: Test
        run: ./gradlew test

      - name: Set up uv for cross-language contract
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.7"
          python-version: "3.12"

      - name: Install locked engine dependencies
        working-directory: engine
        run: uv sync --frozen

      - name: Verify Java against real Python engine
        run: python3 scripts/verify-rag-engine.py

      - name: Secret warning scan
        run: bash scripts/check-secrets.sh

  engine-evaluation:
    name: Python Engine and Retrieval Evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.7"
          python-version: "3.12"
      - name: Install locked engine dependencies
        working-directory: engine
        run: uv sync --frozen
      - name: Engine tests and static checks
        working-directory: engine
        run: |
          uv run --frozen ruff check src tests scripts
          uv run --frozen ruff format --check src tests scripts
          uv run --frozen pytest -q
      - name: Evaluation regressions
        run: python3 -m unittest discover -s evaluation/tests -q

  container-images:
    name: Build, verify, and publish NAS image
    needs: [build-test-security, engine-evaluation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [engine, ocr]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build immutable Linux image
        run: |
          context=engine
          if [ "${{ matrix.component }}" = ocr ]; then context=engine/ocr; fi
          docker build --platform linux/amd64 -t rag-${{ matrix.component }}:check "$context"
      - name: Validate NAS Compose contract
        if: matrix.component == 'engine'
        run: |
          cp engine/.env.example engine/.env
          export RAG_ENGINE_IMAGE=rag-engine:check
          export RAG_OCR_IMAGE=rag-ocr:check
          export RAG_OCR_API_KEY="compose-validation-$(openssl rand -hex 16)"
          docker compose -f engine/compose.nas.yaml config --quiet
      - name: Check bounded container with real parsers/models
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          if [ "$COMPONENT" = ocr ]; then
            docker run -d --name acceptance --memory=2g --cpus=2 --pids-limit=64 --read-only --tmpfs /tmp:rw,size=256m,mode=1777 -e RAG_OCR_API_KEY="$key" rag-ocr:check
            docker exec acceptance python scripts/acceptance.py --url http://127.0.0.1:8092 --output /tmp/acceptance.json
          else
            docker run -d --name acceptance --memory=1536m --cpus=1 --pids-limit=64 --read-only --tmpfs /tmp:rw,size=32m,mode=1777 -e RAG_ENGINE_API_KEY="$key" rag-engine:check
            docker exec acceptance python scripts/container_smoke.py
          fi
          docker inspect acceptance --format 'OOMKilled={{.State.OOMKilled}} Memory={{.HostConfig.Memory}} NanoCpus={{.HostConfig.NanoCpus}}'
          test "$(docker inspect acceptance --format '{{.State.OOMKilled}}')" = false
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified immutable image
        if: github.event_name != 'pull_request'
        env:
          COMPONENT: ${{ matrix.component }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${{ github.repository_owner }}/rag-$COMPONENT:sha-$SOURCE_SHA"
          docker tag "rag-$COMPONENT:check" "$image"
          docker push "$image"
      - name: Container diagnostics
        if: failure()
        run: docker logs --tail 100 acceptance || true
