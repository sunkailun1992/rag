[project]
name = "rag-ocr-cpu"
version = "0.1.0"
description = "Bounded CPU-only PaddleOCR text recognition for the private RAG engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
  "paddlex==3.7.2",
  "pypdfium2==5.7.0",
  "Pillow==13.0.0",
]

[dependency-groups]
dev = ["pytest==9.0.3", "httpx==0.28.1", "ruff==0.15.8", "psutil==7.2.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
